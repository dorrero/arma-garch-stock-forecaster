{% extends 'base.html' %}

{% block content %}
    <div class="page-header text-center">
      <h1>ARMA/GARCH Stock Modelling</h1>
      <p>Pick a ticker and a date range to fit a return model and see the results.</p>
    </div>

    <div class="panel form-panel">
      <form action="{% url 'model' %}" method="POST">
        {% csrf_token %}
        <div class="form-group">
          <label for="ticker">Stock Ticker</label>
          <input type="text" class="form-control" id="ticker" placeholder="e.g. AAPL" name="ticker">
        </div>
        <div class="form-group">
           <label for="start_date">Start Date</label>
           <input class="form-control" type="date" id="start_date" min="2015-01-01" name="start_date">
        </div>
        <div class="form-group">
           <label for="end_date">End Date</label>
           <input class="form-control" type="date" id="end_date" min="2015-01-01" name="end_date">
        </div>
        <button type="submit" class="btn btn-primary btn-block mt-4">Submit</button>
      </form>
    </div>
{% endblock %}
